[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "a2a-seller-agent"
version = "0.1.0"
description = "A deterministic, multi-item seller with A2A transport and private owner controls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "a2a-sdk==1.2.3",
  "uvicorn==0.54.0",
  "starlette==1.10.0",
  "sse-starlette==3.6.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "hatchling>=1.26,<2"]

[project.scripts]
a2a-seller = "a2a_seller.cli:main"

[project.urls]
Repository = "https://github.com/Math1987/a2a-seller-agent"
Issues = "https://github.com/Math1987/a2a-seller-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_seller"]

[tool.hatch.build.targets.wheel.force-include]
"skills/a2a-seller/SKILL.md" = "a2a_seller/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/skills", "/tests", "/README.md", "/pyproject.toml", "/requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
